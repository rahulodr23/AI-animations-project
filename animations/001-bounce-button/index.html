<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bounce Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    .bounce-btn {
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Bricolage Grotesque', sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #6c5ce7, #a855f7);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35);
      transition: box-shadow 0.25s ease;
    }
    .bounce-btn:hover {
      box-shadow: 0 6px 30px rgba(108, 92, 231, 0.5);
    }
  </style>
</head>
<body>
  <button class="bounce-btn">Hover Me</button>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const btn = document.querySelector('.bounce-btn');

    btn.addEventListener('mouseenter', () => {
      gsap.fromTo(btn,
        { scale: 1 },
        { scale: 1.15, duration: 0.3, ease: 'back.out(3)', yoyo: true, repeat: 1 }
      );
    });

    btn.addEventListener('click', () => {
      gsap.timeline()
        .to(btn, { scale: 0.9, duration: 0.1, ease: 'power2.in' })
        .to(btn, { scale: 1, duration: 0.5, ease: 'elastic.out(1, 0.3)' });
    });

    gsap.fromTo(btn,
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out', delay: 0.2 }
    );
  </script>
</body>
</html>
