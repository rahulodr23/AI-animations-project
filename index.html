<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animation Playground</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>

  <!-- Gallery screen -->
  <div id="screen-gallery" class="screen">
    <header class="site-header">
      <h1><span>Anim</span>Playground</h1>
      <span class="header-meta">0 animations</span>
    </header>

    <main class="gallery">
      <h2 class="gallery-title">Animation Library</h2>
      <p class="gallery-subtitle">Click any animation to view it full-size.</p>
      <div class="gallery-grid"></div>
    </main>
  </div>

  <!-- Detail screen -->
  <div id="screen-detail" class="screen screen-detail" hidden>
    <header class="detail-header">
      <button type="button" class="back-btn" id="btn-back" aria-label="Back to library">
        <span class="back-btn-icon" aria-hidden="true">&#8592;</span>
        Back
      </button>
      <span class="detail-title"></span>
    </header>
    <div class="detail-stage"></div>
  </div>

  <script type="module">
    import { init } from '/scripts/gallery.js';
    init();
  </script>
</body>
</html>
