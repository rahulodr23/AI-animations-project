<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Guardian Angel</title>
  <!-- "Franchise Free" (Franchise Bold) served from CDN Fonts -->
  <link href="https://fonts.cdnfonts.com/css/franchise" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 120% at 50% 30%, #0b1519 0%, #05090c 60%, #020405 100%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Perspective lives on the stage so the card tilts in real 3D */
    .stage {
      perspective: 1100px;
      container-type: inline-size;
      width: min(780px, 94vw);
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 1000 / 563;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: pointer;
    }

    /*
      .media clips the picture layers (overflow:hidden flattens 3D, so it's
      kept separate from the title, which pops out with translateZ).
    */
    .media {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #041418;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 36px 80px rgba(0, 0, 0, 0.6);
      transform: translateZ(0);
    }

    .layer {
      position: absolute;
      inset: 0;
      background-image: url('./assets/angel.png');
      background-size: cover;
      background-position: center;
      will-change: transform;
    }

    /* Static base image, slightly zoomed so wing movement never shows an edge */
    .layer.base {
      transform: scale(1.035);
    }

    /*
      Wing flap: two extra copies of the same image, soft-masked to the left
      and right wing, slowly rotating around the angel's shoulders. The mask
      fades out near the body, so the figure itself stays perfectly still
      and no seam is visible.
    */
    .layer.wing-left {
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 30%, transparent 48%);
      mask-image: linear-gradient(to right, #000 0%, #000 30%, transparent 48%);
      transform-origin: 47% 55%;
      animation: flap-left 1.2s ease-in-out infinite alternate;
    }

    .layer.wing-right {
      -webkit-mask-image: linear-gradient(to left, #000 0%, #000 40%, transparent 58%);
      mask-image: linear-gradient(to left, #000 0%, #000 40%, transparent 58%);
      transform-origin: 47% 55%;
      animation: flap-right 1.2s ease-in-out infinite alternate;
    }

    /* rotate(+) lifts the left side, rotate(-) lifts the right side */
    @keyframes flap-left {
      from { transform: scale(1.035) rotate(-0.5deg); }
      to   { transform: scale(1.035) rotate(1.15deg); }
    }

    @keyframes flap-right {
      from { transform: scale(1.035) rotate(0.5deg); }
      to   { transform: scale(1.035) rotate(-1.15deg); }
    }

    /* Backlight glow behind the right wing, drifting left <-> right */
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        40% 50% at 60% 22%,
        rgba(198, 248, 255, 0.42) 0%,
        rgba(110, 215, 235, 0.14) 46%,
        transparent 72%
      );
      mix-blend-mode: screen;
      animation: glow-drift 3.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes glow-drift {
      from { transform: translateX(-2.8%); }
      to   { transform: translateX(2.8%); }
    }

    /* ---------- Title ---------- */

    .title {
      position: absolute;
      left: 5.6cqw;
      bottom: 2.2cqw;
      display: flex;
      flex-direction: column;
      font-family: 'Franchise', 'Haettenschweiler', 'Arial Narrow Bold', Impact, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      color: #f2df2b;
      line-height: 0.94;
      letter-spacing: 0.012em;
      /* pops toward the viewer when the card tilts */
      transform: translateZ(3cqw);
      pointer-events: none;
    }

    .title .cap {
      font-size: 1.2em;
    }

    .line-the {
      font-size: 6.4cqw;
      margin-bottom: -2.8cqw;
      text-shadow:
        0.03em 0.035em 0 #c22585,
        0.075em 0.095em 0 #171a08;
    }

    /*
      Invisible copy of the big "G" from the line below (18.48cqw = 2.8875em
      of this line's 6.4cqw). Its width offsets "The" so it starts exactly
      above the "U" of GUARDIAN.
    */
    .line-the .ghost {
      visibility: hidden;
      display: inline-block;
      font-size: 2.8875em;
      height: 0;
      line-height: 0;
      text-shadow: none;
    }

    .line-main {
      font-size: 15.4cqw;
      text-shadow:
        0.012em 0.015em 0 #c22585,
        0.024em 0.028em 0 #7e1f9e,
        0.05em 0.062em 0 #171a08;
    }

    @media (prefers-reduced-motion: reduce) {
      .layer.wing-left, .layer.wing-right, .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <div class="media">
        <div class="layer base"></div>
        <div class="layer wing-left" aria-hidden="true"></div>
        <div class="layer wing-right" aria-hidden="true"></div>
        <div class="glow" aria-hidden="true"></div>
      </div>
      <div class="title" role="img" aria-label="The Guardian Angel">
        <span class="line-the"><span class="ghost" aria-hidden="true">G</span><span class="cap">T</span>he</span>
        <span class="line-main"><span class="cap">G</span>uardian&nbsp;<span class="cap">A</span>ngel</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const card = document.getElementById('card');

    const MAX_TILT_X = 4.5; // deg, vertical hover
    const MAX_TILT_Y = 6;   // deg, horizontal hover

    gsap.set(card, { transformPerspective: 1100 });

    card.addEventListener('pointerenter', () => {
      gsap.to(card, { scale: 1.015, duration: 0.4, ease: 'power3.out', overwrite: 'auto' });
    });

    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;  // -0.5 .. 0.5
      const py = (e.clientY - r.top) / r.height - 0.5;

      // The side under the cursor dips away, like pressing on the card
      gsap.to(card, {
        rotationX: -py * MAX_TILT_X * 2,
        rotationY: px * MAX_TILT_Y * 2,
        duration: 0.5,
        ease: 'power3.out',
        overwrite: 'auto',
      });
    });

    card.addEventListener('pointerleave', () => {
      gsap.to(card, {
        rotationX: 0,
        rotationY: 0,
        scale: 1,
        duration: 0.9,
        ease: 'elastic.out(1, 0.55)',
        overwrite: 'auto',
      });
    });
  </script>
</body>
</html>
