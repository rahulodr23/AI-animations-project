<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Loader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
    }
    .loader {
      display: flex;
      gap: 12px;
    }
    .loader-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6c5ce7;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
      background: #a855f7;
    }
    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;
      background: #00cec9;
    }
    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</body>
</html>
