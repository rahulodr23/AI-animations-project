<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      cursor: default;
    }

    body.is-success {
      cursor: pointer;
    }

    .stage {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Login button (+30%) ─────────────────── */
    .login-btn {
      position: relative;
      width: 146px;
      height: 146px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .login-btn:disabled {
      cursor: default;
    }

    .login-btn:focus-visible .face {
      outline: 2px solid rgba(255, 255, 255, 0.35);
      outline-offset: 6px;
    }

    /*
      Crystal-water caustic palette:
      white speculars + pale aqua / ice blue — like light on clear water
    */
    /*
      Outer glow — same stroke width as the ring (5px), soft blur kept tight
      so the halo hugs the edge instead of blooming far out
    */
    .glow-bloom {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.9) 0deg,
        rgba(186, 232, 255, 0.65) 24deg,
        rgba(180, 160, 255, 0.35) 48deg,
        rgba(255, 255, 255, 0.2) 72deg,
        rgba(120, 210, 235, 0.55) 100deg,
        rgba(255, 200, 170, 0.3) 128deg,
        rgba(255, 255, 255, 0.85) 155deg,
        rgba(140, 220, 200, 0.35) 185deg,
        rgba(200, 240, 255, 0.6) 215deg,
        rgba(255, 180, 200, 0.28) 248deg,
        rgba(170, 225, 245, 0.7) 285deg,
        rgba(200, 190, 255, 0.32) 318deg,
        rgba(255, 255, 255, 0.9) 360deg
      );
      filter: blur(5px);
      opacity: 0.65;
      z-index: 0;
      will-change: transform;
    }

    /* Sharp fluid ring — water + slight prism refraction */
    .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ffffff 0deg,
        #d8f2ff 18deg,
        #c4b8ff 34deg,
        #9ed8ef 52deg,
        rgba(180, 220, 235, 0.4) 68deg,
        #ffe0d0 82deg,
        #f5fcff 98deg,
        #b6e6f5 120deg,
        #a8f0e0 138deg,
        #ffffff 158deg,
        rgba(160, 210, 230, 0.45) 180deg,
        #ffc8d8 198deg,
        #eaf8ff 218deg,
        #8ecfe6 240deg,
        #b8a8ff 258deg,
        #ffffff 278deg,
        #c5ebf8 300deg,
        #ffdcc8 322deg,
        #ffffff 342deg,
        #ffffff 360deg
      );
      padding: 5px;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: brightness(1.18) contrast(1.08) saturate(1.15);
      z-index: 1;
      will-change: transform;
      box-shadow:
        0 0 6px rgba(200, 240, 255, 0.4),
        0 0 10px rgba(180, 160, 255, 0.15);
    }

    /* Bright caustic hotspots + faint prism glints */
    .glow-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 20deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.95) 10deg,
        rgba(200, 180, 255, 0.55) 16deg,
        transparent 28deg,
        transparent 90deg,
        rgba(220, 245, 255, 0.7) 104deg,
        rgba(255, 200, 180, 0.4) 112deg,
        transparent 128deg,
        transparent 195deg,
        rgba(255, 255, 255, 0.9) 210deg,
        rgba(160, 240, 220, 0.45) 218deg,
        transparent 236deg,
        transparent 300deg,
        rgba(255, 190, 210, 0.4) 318deg,
        rgba(255, 255, 255, 0.75) 328deg,
        transparent 348deg,
        transparent 360deg
      );
      padding: 5px;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: blur(0.5px);
      opacity: 0.95;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }

    /* Matte black recessed face — inset matches thicker ring */
    .face {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, #1a1a1a 0%, #0a0a0a 55%, #050505 100%);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.85),
        inset 0 -1px 1px rgba(255, 255, 255, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      overflow: hidden;
    }

    .face::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.08) 0%,
        transparent 42%,
        transparent 70%,
        rgba(255, 255, 255, 0.03) 100%
      );
      pointer-events: none;
    }

    .user-svg {
      width: 68px;
      height: 68px;
      display: block;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
    }

    /*
      Success sits in the exact same 146×146 slot as .login-btn
      (centered in .stage). Text is placed below so it doesn’t shift the circle.
    */
    .success {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 146px;
      height: 146px;
      margin-top: -73px;
      margin-left: -73px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .success-mark {
      position: relative;
      width: 146px;
      height: 146px;
    }

    /* Green fluid outer glow — same 5px stroke/blur as user icon */
    .success-bloom {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(168, 255, 206, 0.9) 0deg,
        rgba(48, 209, 88, 0.65) 40deg,
        rgba(31, 138, 61, 0.35) 80deg,
        rgba(168, 255, 206, 0.2) 120deg,
        rgba(94, 232, 154, 0.7) 160deg,
        rgba(48, 209, 88, 0.4) 200deg,
        rgba(200, 255, 220, 0.85) 240deg,
        rgba(36, 138, 61, 0.45) 280deg,
        rgba(143, 217, 168, 0.75) 320deg,
        rgba(168, 255, 206, 0.9) 360deg
      );
      filter: blur(5px);
      opacity: 0.7;
      will-change: transform;
    }

    /* Green fluid ring — same 5px stroke as user icon */
    .success-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #c8ffd8 0deg,
        #a8ffce 28deg,
        #30d158 60deg,
        rgba(48, 209, 88, 0.4) 90deg,
        #7dffb0 120deg,
        #1f8a3d 155deg,
        #a8ffce 185deg,
        rgba(143, 217, 168, 0.45) 215deg,
        #5ee89a 250deg,
        #248a3d 285deg,
        #c8ffd8 320deg,
        #30d158 345deg,
        #c8ffd8 360deg
      );
      padding: 5px;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: saturate(1.2) brightness(1.12);
      box-shadow:
        0 0 6px rgba(48, 209, 88, 0.4),
        0 0 10px rgba(168, 255, 206, 0.2);
      will-change: transform;
    }

    /* Bright green caustic hotspots on the stroke */
    .success-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 20deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.9) 10deg,
        rgba(168, 255, 206, 0.7) 16deg,
        transparent 28deg,
        transparent 100deg,
        rgba(200, 255, 220, 0.75) 114deg,
        transparent 132deg,
        transparent 210deg,
        rgba(255, 255, 255, 0.85) 224deg,
        rgba(94, 232, 154, 0.55) 232deg,
        transparent 250deg,
        transparent 320deg,
        rgba(168, 255, 206, 0.6) 334deg,
        transparent 350deg,
        transparent 360deg
      );
      padding: 5px;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: blur(0.5px);
      opacity: 0.95;
      pointer-events: none;
      will-change: transform;
    }

    .success-face {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, #1a1a1a 0%, #0a0a0a 55%, #050505 100%);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.85),
        inset 0 -1px 1px rgba(255, 255, 255, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .success-face::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.08) 0%,
        transparent 42%,
        transparent 70%,
        rgba(48, 209, 88, 0.06) 100%
      );
      pointer-events: none;
    }

    .check-svg {
      width: 68px;
      height: 68px;
      display: block;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
      transform: rotate(8deg);
      transform-origin: 50% 50%;
    }

    .success-text {
      position: absolute;
      top: calc(100% + 20px);
      left: 50%;
      white-space: nowrap;
      color: #e8e8e8;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #f5f5f5 0%, #b8b8b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

  </style>
</head>
<body>
  <div class="stage" id="stage">
    <button class="login-btn" id="loginBtn" type="button" aria-label="Log in">
      <span class="glow-bloom" aria-hidden="true"></span>
      <span class="glow-ring" aria-hidden="true"></span>
      <span class="glow-sheen" aria-hidden="true"></span>
      <span class="face">
        <svg class="user-svg" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f2f2f2" />
              <stop offset="42%" stop-color="#c8c8c8" />
              <stop offset="100%" stop-color="#8a8a8a" />
            </linearGradient>
            <!-- Green liquid fill — steady, matches success checkmark -->
            <linearGradient id="fluidGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a8ffce" />
              <stop offset="45%" stop-color="#30d158" />
              <stop offset="100%" stop-color="#1f8a3d" />
            </linearGradient>
            <clipPath id="fillClip" clipPathUnits="userSpaceOnUse">
              <rect id="fillRect" x="0" y="24" width="24" height="0" />
            </clipPath>
          </defs>

          <g fill="url(#metalGrad)">
            <circle cx="12" cy="8" r="3.6" />
            <path d="M5.2 18.8c0-3.05 2.95-5.3 6.8-5.3s6.8 2.25 6.8 5.3c0 .55-.45 1-1 1H6.2c-.55 0-1-.45-1-1z" />
          </g>

          <g fill="url(#fluidGrad)" clip-path="url(#fillClip)">
            <circle cx="12" cy="8" r="3.6" />
            <path d="M5.2 18.8c0-3.05 2.95-5.3 6.8-5.3s6.8 2.25 6.8 5.3c0 .55-.45 1-1 1H6.2c-.55 0-1-.45-1-1z" />
          </g>
        </svg>
      </span>
    </button>

    <div class="success" id="success" aria-live="polite">
      <div class="success-mark">
        <span class="success-bloom" aria-hidden="true"></span>
        <span class="success-ring" aria-hidden="true"></span>
        <span class="success-sheen" aria-hidden="true"></span>
        <span class="success-face">
          <svg class="check-svg" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="checkGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#a8ffce" />
                <stop offset="45%" stop-color="#30d158" />
                <stop offset="100%" stop-color="#1f8a3d" />
              </linearGradient>
            </defs>
            <path
              id="checkPath"
              fill="none"
              stroke="url(#checkGrad)"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 12 L10.5 16.5 L19 8"
            />
          </svg>
        </span>
      </div>
      <p class="success-text">Successfully logged in</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const fillRect = document.getElementById('fillRect');
    const success = document.getElementById('success');
    const checkPath = document.getElementById('checkPath');
    const glowParts = ['.glow-bloom', '.glow-ring', '.glow-sheen'];

    let state = 'idle'; // idle | animating | success
    let glowTweens = [];
    let successGlowTweens = [];
    let mainTl = null;
    let isHolding = false;   // pointer currently down
    let pressTween = null;

    const PRESS_SCALE = 0.88; // same shrink for tap and hold
    const checkLength = checkPath.getTotalLength();
    // Fully hide the stroke until the draw starts (avoids flash/glitch)
    gsap.set(checkPath, {
      strokeDasharray: `${checkLength} ${checkLength}`,
      strokeDashoffset: checkLength,
      autoAlpha: 0,
    });
    gsap.set(fillRect, { attr: { y: 24, height: 0 } });
    gsap.set(success, { autoAlpha: 0, scale: 0.85 });
    gsap.set('.success-text', { xPercent: -50 });

    function setBusy(busy) {
      document.body.classList.toggle('is-busy', busy);
      loginBtn.disabled = busy;
    }

    /**
     * Continuous fluid spin.
     * dir: -1 = anticlockwise (idle), +1 = clockwise (active)
     * duration: seconds per full turn (lower = faster)
     */
    function startGlowSpin(dir = -1, duration = 5.2) {
      stopGlowSpin();

      const layers = [
        { sel: '.glow-ring', dur: duration },
        { sel: '.glow-bloom', dur: duration * 1.25 },
        { sel: '.glow-sheen', dur: duration * 0.72 },
      ];

      glowTweens = layers.map(({ sel, dur }) =>
        gsap.to(sel, {
          rotation: `+=${dir * 360}`,
          duration: dur,
          ease: 'none',
          repeat: -1,
          transformOrigin: '50% 50%',
        })
      );
    }

    function stopGlowSpin() {
      glowTweens.forEach((t) => t.kill());
      glowTweens = [];
    }

    /** Clockwise green fluid spin on the success ring */
    function startSuccessSpin(duration = 2.4) {
      stopSuccessSpin();

      const layers = [
        { sel: '.success-ring', dur: duration },
        { sel: '.success-bloom', dur: duration * 1.25 },
        { sel: '.success-sheen', dur: duration * 0.72 },
      ];

      successGlowTweens = layers.map(({ sel, dur }) =>
        gsap.to(sel, {
          rotation: '+=360',
          duration: dur,
          ease: 'none',
          repeat: -1,
          transformOrigin: '50% 50%',
        })
      );
    }

    function stopSuccessSpin() {
      successGlowTweens.forEach((t) => t.kill());
      successGlowTweens = [];
      gsap.set(['.success-ring', '.success-bloom', '.success-sheen'], {
        clearProps: 'transform',
      });
    }

    function pressDown() {
      if (state !== 'idle' || isHolding) return;
      isHolding = true;

      // Same shrink for tap or hold — stays until release
      if (pressTween) pressTween.kill();
      pressTween = gsap.to(loginBtn, {
        scale: PRESS_SCALE,
        duration: 0.38,
        ease: 'power2.out',
        transformOrigin: '50% 50%',
      });
    }

    function springBack() {
      if (pressTween) pressTween.kill();
      pressTween = gsap.to(loginBtn, {
        scale: 1,
        duration: 0.28,
        ease: 'power2.out',
        transformOrigin: '50% 50%',
      });
    }

    function pressUp(shouldPlay) {
      if (!isHolding) return;
      isHolding = false;

      // Stop the press tween — release owns the scale-back
      if (pressTween) {
        pressTween.kill();
        pressTween = null;
      }

      if (shouldPlay && state === 'idle') {
        // Login motion starts exactly on release (tap or hold — same)
        playLogin();
        return;
      }

      // Cancelled press — spring back to idle size
      springBack();
    }

    function playLogin() {
      if (state !== 'idle') return;
      state = 'animating';
      setBusy(true);

      mainTl = gsap.timeline({
        onComplete: () => {
          state = 'success';
          setBusy(false);
          document.body.classList.add('is-success');
          stopGlowSpin();
        },
      });

      // 1) On leave: scale back to original size
      mainTl.to(loginBtn, {
        scale: 1,
        duration: 0.28,
        ease: 'power2.out',
        transformOrigin: '50% 50%',
      }, 0);

      // 2) Same moment: reverse glow (faster) + green fill begins
      mainTl.call(() => startGlowSpin(1, 0.55), null, 0);

      mainTl.to(fillRect, {
        attr: { y: 0, height: 24 },
        duration: 1.755,
        ease: 'power2.inOut',
      }, 0);

      mainTl.to('.face', {
        boxShadow: 'inset 0 2px 6px rgba(0,0,0,0.85), inset 0 -1px 1px rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 16px rgba(48,209,88,0.22)',
        duration: 1.755,
        ease: 'power2.inOut',
      }, 0);

      // Brief steady hold on the filled green icon, then exit
      mainTl.to(loginBtn, {
        scale: 0,
        autoAlpha: 0,
        duration: 0.45,
        ease: 'power3.in',
        transformOrigin: '50% 50%',
      }, '+=0.35');

      mainTl.set(success, { visibility: 'visible' }, '-=0.12')
        .fromTo(success, {
          autoAlpha: 0,
          scale: 0.7,
        }, {
          autoAlpha: 1,
          scale: 1,
          duration: 0.5,
          ease: 'back.out(1.4)',
          onStart: () => startSuccessSpin(2.4),
        }, '-=0.08')
        // Draw check after the circle settles — left tip → bottom → top-right
        .set(checkPath, {
          strokeDasharray: `${checkLength} ${checkLength}`,
          strokeDashoffset: checkLength,
          autoAlpha: 1,
        })
        .fromTo(checkPath, {
          strokeDashoffset: checkLength,
          scale: 0.92,
          transformOrigin: '50% 50%',
        }, {
          strokeDashoffset: 0,
          scale: 1,
          duration: 0.75,
          ease: 'expo.out',
        })
        .from('.success-text', {
          autoAlpha: 0,
          y: 8,
          duration: 0.45,
          ease: 'power3.out',
        }, '-=0.35');
    }

    function resetToIdle() {
      if (state !== 'success') return;

      if (mainTl) {
        mainTl.kill();
        mainTl = null;
      }
      stopGlowSpin();
      stopSuccessSpin();
      isHolding = false;

      const tl = gsap.timeline({
        onComplete: () => {
          state = 'idle';
          document.body.classList.remove('is-success');
          gsap.set(loginBtn, { clearProps: 'transform' });
          gsap.set('.face', { clearProps: 'boxShadow' });
          startGlowSpin(-1, 5.2);
        },
      });

      tl.to(success, {
        autoAlpha: 0,
        scale: 0.85,
        duration: 0.3,
        ease: 'power2.in',
      })
      .set(success, { visibility: 'hidden' })
      .set(checkPath, {
        strokeDasharray: `${checkLength} ${checkLength}`,
        strokeDashoffset: checkLength,
        autoAlpha: 0,
      })
      .set(fillRect, { attr: { y: 24, height: 0 } })
      .set(loginBtn, { scale: 0.85, autoAlpha: 0 })
      .to(loginBtn, {
        scale: 1,
        autoAlpha: 1,
        duration: 0.45,
        ease: 'back.out(1.5)',
      });
    }

    // Press & hold → shrink; release → run login animation
    loginBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (state !== 'idle') return;
      loginBtn.setPointerCapture?.(e.pointerId);
      pressDown();
    });

    loginBtn.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      pressUp(true);
    });

    loginBtn.addEventListener('pointercancel', () => {
      pressUp(false);
    });

    loginBtn.addEventListener('lostpointercapture', () => {
      if (isHolding) pressUp(false);
    });

    // Prevent default click from double-firing after pointerup
    loginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    document.body.addEventListener('click', () => {
      resetToIdle();
    });

    // Idle: slow anticlockwise caustic drift
    startGlowSpin(-1, 5.2);

    gsap.from(loginBtn, {
      autoAlpha: 0,
      scale: 0.88,
      duration: 0.55,
      ease: 'power3.out',
      delay: 0.05,
    });
  </script>
</body>
