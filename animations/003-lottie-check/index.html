<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success Checkmark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: 'Bricolage Grotesque', sans-serif;
      gap: 20px;
    }
    #lottie-container {
      width: 160px;
      height: 160px;
    }
    .label {
      color: #8888a0;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.5s ease 0.6s;
    }
    .label.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="lottie-container"></div>
  <p class="label">Success!</p>

  <script src="https://cdn.jsdelivr.net/npm/lottie-web@5/build/player/lottie.min.js"></script>
  <script>
    const anim = lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: false,
      autoplay: true,
      path: './assets/checkmark.json',
    });

    anim.addEventListener('complete', () => {
      document.querySelector('.label').classList.add('show');
    });

    document.body.addEventListener('click', () => {
      document.querySelector('.label').classList.remove('show');
      anim.goToAndPlay(0);
    });
  </script>
</body>
</html>
